<svg xmlns="http://www.w3.org/2000/svg" width="320" height="308" viewBox="0 0 320 308" role="img" aria-label="About Sagar Gupta"><title>About Sagar Gupta</title><style>text{font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif;font-variant-numeric:tabular-nums}</style><defs><linearGradient id="shine" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="0.5" stop-color="#fff" stop-opacity="0.06"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient><clipPath id="card"><rect x="1" y="1" width="318" height="306" rx="14"/></clipPath></defs><rect x=".5" y=".5" width="319" height="307" rx="14" fill="#0b1012" stroke="#26343d"/><rect x="0" y="20" width="3" height="26" rx="1.5" fill="#60a5fa"><animate attributeName="opacity" values="1;0.4;1" dur="3s" repeatCount="indefinite"/></rect><g opacity="0"><animate attributeName="opacity" to="1" begin="0.15s" dur="0.45s" fill="freeze"/><animateTransform attributeName="transform" type="translate" from="0 10" to="0 0" begin="0.15s" dur="0.45s" fill="freeze"/><text x="18" y="29" font-size="11" font-weight="700" fill="#60a5fa" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" letter-spacing="1">ABOUT</text></g><g opacity="0"><animate attributeName="opacity" to="1" begin="0.25s" dur="0.45s" fill="freeze"/><animateTransform attributeName="transform" type="translate" from="0 10" to="0 0" begin="0.25s" dur="0.45s" fill="freeze"/><text x="18" y="56.18" font-size="15" font-weight="500" fill="#d6dde5">Cloud consultant at AWS</text><text x="18" y="76.88" font-size="15" font-weight="500" fill="#d6dde5">Professional Services. Terraform,</text><text x="18" y="97.58" font-size="15" font-weight="500" fill="#d6dde5">CI/CD, security guardrails and</text><text x="18" y="118.28" font-size="15" font-weight="500" fill="#d6dde5">SageMaker MLOps pipelines, plus</text><text x="18" y="138.98" font-size="15" font-weight="500" fill="#d6dde5">the MCP