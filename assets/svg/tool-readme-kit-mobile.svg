<svg xmlns="http://www.w3.org/2000/svg" width="320" height="220" viewBox="0 0 320 220" role="img" aria-label="readme-kit: GitHub Action that turns one profile.yml into a full set of animated profile README cards. Built with Python 3.13, GitHub Actions, YAML."><style>.m{font-family:'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace;font-weight:700;letter-spacing:1px}.t{font-family:'Segoe UI',Inter,-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif;font-weight:800}.s{font-family:'Segoe UI',Inter,-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif;font-weight:500}</style><rect x="0.5" y="0.5" width="319" height="219" rx="14" fill="#0f171c" stroke="rgba(255,255,255,0.09)"/><rect x="0" y="20" width="3" height="24" rx="1.5" fill="#38bdf8"><animate attributeName="opacity" values="1;0.4;1" dur="3s" begin="0.75s" repeatCount="indefinite"/></rect><text class="t" x="18" y="40" fill="#f3f4f6" font-size="18">readme-kit</text><text class="s" x="18" y="66" fill="#cbd5e1" font-size="15">GitHub Action that turns one</text><text class="s" x="18" y="87" fill="#cbd5e1" font-size="15">profile.yml into a full set of</text><text class="s" x="18" y="108" fill="#cbd5e1" font-size="15">animated profile README cards.</text><rect x="18.0" y="188" width="98.5" height="20" rx="10" fill="#60a5fa14" stroke="#60a5fa55"/><text class="m" x="67.2" y="202.5" text-anchor="middle" fill="#60a5fa" font-size="10.5">Python 3.13</text><rect x="122.5" y="188" width="121.0" height="20" rx="10" fill="#60a5fa14" stroke="#60a5fa55"/><text class="m" x="183.0" y="202.5" text-anchor="middle" fill="#60a5fa" font-size="10.5">GitHub Actions</text></svg>