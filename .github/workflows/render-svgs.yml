# Re-renders the README's self-hosted animated SVGs in assets/svg/ daily and
# refreshes the README blocks generated from the portfolio's data (career
# engagements, publications, open-source tables with live PR states). The
# script keeps the last good values when any source is down, so a failed
# fetch never blanks an image or a table.
name: Render README SVGs
on:
  schedule:
    - cron: "30 6 * * *" # Daily 6:30 AM UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/render-svgs.py
      - assets/logos/**

permissions:
  contents: write

# runs queue instead of overlapping: two runs pushing at once reject each other
concurrency:
  group: render-readme-svgs
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: GitHub stats card
        uses: Sagargupta16/github-stats-card-action@4a7221cb12bbfb6e89d97c7a2623b60596bf105e # v1.1.0
        with:
          username: Sagargupta16
          output: assets/svg/github.svg

      - name: LeetCode card
        uses: Sagargupta16/leetcode-card-action@ad7ddec98a2a2e6dfa3feed553e629a6df1a52e4 # v1.0.1
        with:
          username: sagargupta1610
          output: assets/svg/leetcode.svg

      - name: Render SVGs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/render-svgs.py

      - name: Commit updated SVGs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/svg README.md COMMUNITY.md
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh readme svgs and portfolio blocks"
            # another bot (metrics, credly, snake) may have pushed meanwhile
            git pull --rebase --autostash origin main
            git push
          else
            echo "No SVG changes to commit"
          fi
