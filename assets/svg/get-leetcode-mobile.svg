<svg xmlns="http://www.w3.org/2000/svg" width="320" height="72" viewBox="0 0 320 72" role="img" aria-label="Get the LeetCode card for your own profile"><title>Get the LeetCode card for your own profile</title><style>text{font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif;font-variant-numeric:tabular-nums}</style><defs><linearGradient id="shine" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="0.5" stop-color="#fff" stop-opacity="0.06"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient><clipPath id="card"><rect x="1" y="1" width="318" height="70" rx="14"/></clipPath></defs><rect x=".5" y=".5" width="319" height="71" rx="14" fill="#0b1012" stroke="#26343d"/><rect x="0" y="20" width="3" height="26" rx="1.5" fill="#60a5fa"><animate attributeName="opacity" values="1;0.4;1" dur="3s" repeatCount="indefinite"/></rect><g><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.250;1" dur="0.60s" fill="freeze"/><animateTransform attributeName="transform" type="translate" values="0 10;0 10;0 0" keyTimes="0;0.250;1" dur="0.60s" fill="freeze"/><text x="18" y="32" font-size="14" font-weight="650" fill="#60a5fa">Get the LeetCode card →</text></g><g><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.357;1" dur="0.70s" fill="freeze"/><animateTransform attributeName="transform" type="translate" values="0 10;0 10;0 0" keyTimes="0;0.357;1" dur="0.70s" fill="freeze"/><text x="18" y="49.32" font-size="12" font-weight="500" fill="#b1bfcc">Add it to your own profile README.</text></g><g clip-path="url(#card)"><rect x="-140" y="0" width="120" height="72" fill="url(#shine)" transform="skewX(-18)"><animateTransform attributeName="transform" type="translate" values="0 0;624 0" dur="7s" begin="0.85s" repeatCount="indefinite" additive="sum"/></rect></g></svg>