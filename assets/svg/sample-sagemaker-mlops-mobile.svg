<svg xmlns="http://www.w3.org/2000/svg" width="320" height="562" viewBox="0 0 320 562" role="img" aria-label="SageMaker image classification MLOps"><title>SageMaker image classification MLOps</title><style>text{font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif;font-variant-numeric:tabular-nums}</style><rect x=".5" y=".5" width="319" height="561" rx="14" fill="#0b1012" stroke="#26343d"/><text x="20" y="35" font-size="15" font-weight="700" fill="#38bdf8">AWS SAMPLE</text><text x="20" y="69.3" font-size="20" font-weight="700" fill="#38bdf8">SageMaker image</text><text x="20" y="97.7" font-size="20" font-weight="700" fill="#38bdf8">classification MLOps</text><text x="20" y="135.1" font-size="17" font-weight="500" fill="#b1bfcc">An end-to-end MLOps</text><text x="20" y="159.24" font-size="17" font-weight="500" fill="#b1bfcc">pipeline, declared in</text><text x="20" y="183.38" font-size="17" font-weight="500" fill="#b1bfcc">Terraform.</text><path d="M20 198.52H300" stroke="#26343d"/><text x="20" y="231.52" font-size="17" font-weight="650" fill="#f3f4f6">01 · Ingest and train</text><text x="20" y="260.66" font-size="17" font-weight="500" fill="#b1bfcc">Event-driven ingestion and</text><text x="20" y="284.8" font-size="17" font-weight="500" fill="#b1bfcc">SageMaker training pipelines.</text><text x="20" y="324.94" font-size="17" font-weight="650" fill="#f3f4f6">02 · Evaluate and deploy</text><text x="20" y="354.08" font-size="17" font-weight="500" fill="#b1bfcc">Quality gates and</text><text x="20" y="378.22" font-size="17" font-weight="500" fill="#b1bfcc">human-approved model</text><text x="20" y="402.36" font-size="17" font-weight="500" fill="#b1bfcc">deployment.</text><text x="20" y="442.5" font-size="17" font-weight="650" fill="#f3f4f6">03 · Monitor and retrain</text><text x="20" y="471.64" font-size="17" font-weight="500" fill="#b1bfcc">Detect drift and trigger the</text><text x="20" y="495.78" font-size="17" font-weight="500" fill="#b1bfcc">retraining loop.</text><text x="20" y="534.92" font-size="16" font-weight="650" fill="#60a5fa">View source on GitHub →</text></svg>