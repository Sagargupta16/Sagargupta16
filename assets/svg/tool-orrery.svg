<svg xmlns="http://www.w3.org/2000/svg" width="270" height="220" viewBox="0 0 270 220" role="img" aria-label="orrery: Animated architecture diagrams from one YAML spec, with official AWS, Azure, Google Cloud and Kubernetes icons. Built with TypeScript, ELK, SVG. 1,805 npm downloads a month."><style>.k{font-family:'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace;font-weight:700;letter-spacing:2px}.m{font-family:'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace;font-weight:700;letter-spacing:1.2px}.c{font-family:'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace;font-weight:500}.t{font-family:'Segoe UI',Inter,-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif;font-weight:800;letter-spacing:-0.2px}.s{font-family:'Segoe UI',Inter,-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif;font-weight:600}.b{font-family:'Segoe UI',Inter,-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif;font-weight:500}.n{font-family:'Segoe UI',Inter,-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif;font-weight:800;font-variant-numeric:tabular-nums}</style><rect x="0.5" y="0.5" width="269" height="219" rx="14" fill="#0f171c" stroke="rgba(255,255,255,0.09)"/><rect x="0" y="20" width="3" height="24" rx="1.5" fill="#38bdf8"><animate attributeName="opacity" values="1;0.4;1" keyTimes="0;0.5;1" dur="3s" repeatCount="indefinite"/></rect><text class="t" x="18" y="40" font-size="16" fill="#f3f4f6">orrery</text><text class="b" x="18" y="66" font-size="13" fill="rgba(255,255,255,0.78)">Animated architecture diagrams</text><text class="b" x="18" y="84" font-size="13" fill="rgba(255,255,255,0.78)">from one YAML spec, with official</text><text class="b" x="18" y="102" font-size="13" fill="rgba(255,255,255,0.78)">AWS, Azure, Google Cloud and</text><text class="b" x="18" y="120" font-size="13" fill="rgba(255,255,255,0.78)">Kubernetes icons.</text><rect x="18" y="134" width="104.8" height="20" rx=