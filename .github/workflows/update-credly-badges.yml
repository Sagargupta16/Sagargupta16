# Credly Badges Auto-Update Workflow
# Uses Sagargupta16/credly-badge-readme-action to fetch and update badges
name: Update Credly Badges

on:
  schedule:
    - cron: "0 9 * * 1" # Every Monday at 9 AM UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (show changes without committing)"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

# The daily renderer also updates variants of this card; serialize both writers.
concurrency:
  group: render-readme-svgs
  cancel-in-progress: false

jobs:
  update-badges:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Read Credly username from config
        id: config
        run: |
          CREDLY_USER=$(python scripts/validate-readme.py --config-value credly.username)
          echo "credly_user=$CREDLY_USER" >> "$GITHUB_OUTPUT"

      - name: Update Credly badges
        id: credly
        uses: Sagargupta16/credly-badge-readme-action@558f61895d960b06c29c856d34c22cd47fb2e1be # v1.2.0
        with:
          credly-username: ${{ steps.config.outputs.credly_user }}
          # The action owns the badge data and original certification card.
          readme-path: assets/credly-badges.md
          # also draw every badge as the certifications card the README shows
          output: both
          svg-path: assets/svg/certs.svg

      - name: Refresh responsive and static variants
        run: python scripts/render-svgs.py --offline

      - name: Validate generated profile
        run: |
          python -m unittest discover -s tests -v
          python scripts/validate-readme.py

      - name: Show diff
        run: |
          if git diff --quiet assets/credly-badges.md assets/svg README.md COMMUNITY.md; then
            echo "No generated profile changes detected."
          else
            echo "Changes detected:"
            git diff --stat assets/credly-badges.md assets/svg README.md COMMUNITY.md
          fi

      - name: Commit changes
        # the action's changed output was never set, so this step never ran; git diff decides instead
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/credly-badges.md assets/svg README.md COMMUNITY.md
          if ! git diff --cached --quiet; then
            git commit -m "chore: update Credly badges"
            git pull --rebase --autostash origin main
            git push
          fi

      - name: Dry run notice
        if: ${{ github.event.inputs.dry_run == 'true' }}
        run: echo "::notice::Dry run mode - changes were NOT committed"
